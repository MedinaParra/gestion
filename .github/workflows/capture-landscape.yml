name: Capture Royal Spin 5.0 Landscape

on:
  pull_request:
  workflow_dispatch:

jobs:
  capture-landscape:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      ANDROID_AVD_HOME: ${{ github.workspace }}/.android-avd-landscape
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install verified Gradle 8.13
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gradle-8.13-bin.zip"
          curl --fail --location --retry 8 --retry-delay 4 --retry-all-errors \
            "https://downloads.gradle.org/distributions/gradle-8.13-bin.zip" \
            --output "$archive"
          echo "20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78  $archive" \
            | sha256sum --check --strict
          unzip -q "$archive" -d "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/gradle-8.13/bin" >> "$GITHUB_PATH"

      - name: Build landscape APK
        run: gradle --no-daemon --max-workers=2 :landscape:assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true

      - name: Install emulator image
        run: sdkmanager "emulator" "system-images;android-29;default;x86_64"

      - name: Create and boot landscape AVD
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p media "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd \
            --force --name royal_landscape_v5 \
            --package "system-images;android-29;default;x86_64" \
            --device "pixel_2" \
            --path "$ANDROID_AVD_HOME/royal_landscape_v5.avd"
          config="$ANDROID_AVD_HOME/royal_landscape_v5.avd/config.ini"
          printf '\nhw.cpu.ncore=2\nhw.ramSize=2048\nhw.gpu.enabled=yes\nhw.gpu.mode=swiftshader_indirect\n' >> "$config"
          nohup "$ANDROID_HOME/emulator/emulator" @royal_landscape_v5 \
            -no-window -no-snapshot -noaudio -no-boot-anim \
            -gpu swiftshader_indirect -accel on -memory 2048 \
            > media/emulator.log 2>&1 &
          echo $! > media/emulator.pid
          timeout 180 adb wait-for-device
          for attempt in $(seq 1 240); do
            booted=$(timeout 10 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            [ "$booted" = "1" ] && break
            sleep 2
          done
          test "${booted:-}" = "1"
          adb shell settings put secure immersive_mode_confirmations confirmed || true
          adb install -r landscape/build/outputs/apk/debug/landscape-debug.apk
          touch media/boot-ready

      - name: Capture landscape scenes
        shell: bash
        run: |
          set -euo pipefail
          package=cl.exequiel.royalspin.landscape
          activity="$package/.LandscapeMainActivity"
          adb logcat -c

          capture() {
            scene="$1"
            file="$2"
            delay="${3:-3}"
            adb shell am force-stop "$package" || true
            adb shell am start -W -n "$activity" --es demo "$scene"
            adb shell settings put system accelerometer_rotation 0 || true
            adb shell settings put system user_rotation 1 || true
            sleep "$delay"
            for retry in 1 2 3; do
              adb exec-out screencap -p > "media/$file"
              bytes=$(stat -c%s "media/$file" || echo 0)
              [ "$bytes" -gt 50000 ] && break
              sleep 2
            done
            test $(stat -c%s "media/$file") -gt 50000
          }

          capture idle    01-idle-landscape.png 3
          capture bell    02-bell-win.png 3
          capture bar     03-bar-lock.png 3
          capture seven   04-seven-jackpot.png 3
          capture diamond 05-diamond-prism.png 3
          capture wild    06-wild-royal.png 3
          capture feature 07-free-spins-landscape.png 3

          adb shell am force-stop "$package" || true
          adb shell am start -W -n "$activity" --es demo idle
          sleep 2
          adb shell screenrecord --time-limit 8 /sdcard/idle-landscape.mp4 &
          wait $! || true
          adb pull /sdcard/idle-landscape.mp4 media/idle-landscape.mp4

          adb shell am force-stop "$package" || true
          adb shell am start -W -n "$activity" --es demo feature
          sleep 2
          adb shell screenrecord --time-limit 8 /sdcard/feature-landscape.mp4 &
          wait $! || true
          adb pull /sdcard/feature-landscape.mp4 media/feature-landscape.mp4

          adb logcat -d > media/logcat.txt
          ! grep -q "FATAL EXCEPTION" media/logcat.txt

      - name: Validate media
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, struct
          images = sorted(pathlib.Path('media').glob('*.png'))
          assert len(images) == 7, len(images)
          for image in images:
              data = image.read_bytes()
              assert data.startswith(b'\x89PNG\r\n\x1a\n')
              width, height = struct.unpack('>II', data[16:24])
              assert width > height, (image.name, width, height)
              assert width >= 900 and height >= 500
              assert len(data) > 50000
              print(image.name, width, height, len(data))
          videos = sorted(pathlib.Path('media').glob('*.mp4'))
          assert len(videos) == 2
          for video in videos:
              assert video.stat().st_size > 100000
              print(video.name, video.stat().st_size)
          PY

      - name: Upload landscape media
        uses: actions/upload-artifact@v4
        with:
          name: RoyalSpin-v5.0-landscape-media
          path: media/**
          if-no-files-found: error

      - name: Upload emulator APK
        uses: actions/upload-artifact@v4
        with:
          name: RoyalSpin-v5.0-landscape-emulator-apk
          path: landscape/build/outputs/apk/debug/landscape-debug.apk
          if-no-files-found: error
