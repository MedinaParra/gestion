name: Capture Royal Spin Landscape Premium

on:
  pull_request:
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      ANDROID_AVD_HOME: ${{ github.workspace }}/.android-avd
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install verified Gradle 8.13
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gradle-8.13-bin.zip"
          curl --fail --location --retry 8 --retry-delay 4 --retry-all-errors \
            "https://downloads.gradle.org/distributions/gradle-8.13-bin.zip" \
            --output "$archive"
          echo "20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78  $archive" \
            | sha256sum --check --strict
          unzip -q "$archive" -d "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/gradle-8.13/bin" >> "$GITHUB_PATH"

      - name: Build landscape APK
        run: gradle --no-daemon --max-workers=2 :landscapeApp:assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true

      - name: Install emulator image
        run: sdkmanager "emulator" "system-images;android-29;default;x86_64"

      - name: Boot landscape AVD
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p media "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd \
            --force --name royal_landscape \
            --package "system-images;android-29;default;x86_64" \
            --device "pixel_2" \
            --path "$ANDROID_AVD_HOME/royal_landscape.avd"
          cat >> "$ANDROID_AVD_HOME/royal_landscape.avd/config.ini" <<'EOF'
          hw.cpu.ncore=2
          hw.ramSize=2048
          hw.gpu.enabled=yes
          hw.gpu.mode=swiftshader_indirect
          hw.initialOrientation=landscape
          EOF
          nohup "$ANDROID_HOME/emulator/emulator" @royal_landscape \
            -no-window -no-snapshot -noaudio -no-boot-anim \
            -gpu swiftshader_indirect -accel on -memory 2048 \
            > media/emulator.log 2>&1 &
          timeout 180 adb wait-for-device
          for attempt in $(seq 1 240); do
            booted=$(timeout 10 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            [ "$booted" = "1" ] && break
            sleep 2
          done
          [ "${booted:-}" = "1" ]
          adb shell settings put system accelerometer_rotation 0 || true
          adb shell settings put system user_rotation 1 || true
          adb shell wm size 1280x720 || true
          adb shell wm density 240 || true
          adb shell settings put secure immersive_mode_confirmations confirmed || true
          adb install -r landscapeApp/build/outputs/apk/debug/landscapeApp-debug.apk

      - name: Capture landscape states
        shell: bash
        run: |
          set -euo pipefail
          package=cl.exequiel.royalspin.landscape
          activity="$package/.LandscapeMainActivity"
          capture_demo() {
            scene="$1"
            file="$2"
            adb shell am force-stop "$package" || true
            if [ -n "$scene" ]; then
              adb shell am start -W -n "$activity" --es demo "$scene"
            else
              adb shell am start -W -n "$activity"
            fi
            sleep 3
            adb exec-out screencap -p > "media/$file"
          }

          adb shell pm clear "$package" || true
          capture_demo "" idle-landscape.png
          adb shell input tap 1136 440 || true
          sleep 1
          adb exec-out screencap -p > media/spinning-landscape.png
          sleep 3
          capture_demo bell bell-win-landscape.png
          capture_demo bar bar-win-landscape.png
          capture_demo seven seven-win-landscape.png
          capture_demo diamond diamond-win-landscape.png
          capture_demo wild wild-win-landscape.png
          capture_demo feature free-spins-landscape.png

          adb shell am force-stop "$package" || true
          adb shell am start -W -n "$activity"
          sleep 2
          adb shell screenrecord --time-limit 8 /sdcard/landscape-idle.mp4 &
          wait $! || true
          adb pull /sdcard/landscape-idle.mp4 media/landscape-idle.mp4

          adb shell am force-stop "$package" || true
          adb shell am start -W -n "$activity" --es demo feature
          sleep 1
          adb shell screenrecord --time-limit 8 /sdcard/landscape-feature.mp4 &
          wait $! || true
          adb pull /sdcard/landscape-feature.mp4 media/landscape-feature.mp4

          adb logcat -d > media/logcat.txt || true
          ! grep -q "FATAL EXCEPTION" media/logcat.txt

      - name: Validate media
        id: validate_media
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, struct
          images = sorted(pathlib.Path("media").glob("*.png"))
          assert len(images) == 8, f"expected 8 images, found {len(images)}"
          for image in images:
              data = image.read_bytes()
              assert data.startswith(b"\x89PNG\r\n\x1a\n"), image
              width, height = struct.unpack(">II", data[16:24])
              assert width > height, (image, width, height)
              assert width >= 1000 and height >= 600, (image, width, height)
              assert len(data) > 30000, (image, len(data))
              print(image.name, width, height, len(data))
          videos = sorted(pathlib.Path("media").glob("*.mp4"))
          assert len(videos) == 2, f"expected 2 videos, found {len(videos)}"
          for video in videos:
              assert video.stat().st_size > 50000, (video, video.stat().st_size)
              print(video.name, video.stat().st_size)
          PY

      - name: Upload landscape media
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RoyalSpin-Landscape-v1-media
          path: media/**
          if-no-files-found: error

      - name: Upload emulator APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RoyalSpin-Landscape-v1-emulator-APK
          path: landscapeApp/build/outputs/apk/debug/landscapeApp-debug.apk
          if-no-files-found: error

      - name: Verify media
        run: test "${{ steps.validate_media.outcome }}" = "success"
