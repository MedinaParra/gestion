name: Smoke Royal Spin Landscape Modern Android

on:
  pull_request:
    paths:
      - 'landscapeApp/**'
      - '.github/workflows/smoke-landscape-modern.yml'
  workflow_dispatch:

jobs:
  smoke-modern:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build startup-safe APK
        run: gradle --no-daemon :landscapeApp:testDebugUnitTest :landscapeApp:lintDebug :landscapeApp:assembleDebug

      - name: Cold start and spin on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          emulator-boot-timeout: 900
          disable-animations: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail
            mkdir -p modern-smoke
            package=cl.exequiel.royalspin.landscape
            activity="$package/.LandscapeMainActivity"
            apk=landscapeApp/build/outputs/apk/debug/landscapeApp-debug.apk

            adb shell wm size 1280x720 || true
            adb shell wm density 240 || true
            adb install -r "$apk"
            adb shell pm clear "$package" || true
            adb logcat -c

            start_output=$(adb shell am start -W -n "$activity")
            printf '%s\n' "$start_output" | tee modern-smoke/start-output.txt
            sleep 9

            pid=$(adb shell pidof "$package" | tr -d '\r')
            test -n "$pid"
            adb exec-out screencap -p > modern-smoke/01-started.png
            test -s modern-smoke/01-started.png

            adb shell input tap 1136 440
            sleep 1
            pid=$(adb shell pidof "$package" | tr -d '\r')
            test -n "$pid"
            adb exec-out screencap -p > modern-smoke/02-spinning.png
            test -s modern-smoke/02-spinning.png

            sleep 4
            pid=$(adb shell pidof "$package" | tr -d '\r')
            test -n "$pid"
            adb logcat -d > modern-smoke/logcat.txt
            ! grep -q "FATAL EXCEPTION" modern-smoke/logcat.txt
            ! grep -q "ANR in $package" modern-smoke/logcat.txt

      - name: Upload modern smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RoyalSpin-Landscape-v2.1-modern-smoke
          path: modern-smoke/**
          if-no-files-found: warn

      - name: Upload startup-safe APK
        uses: actions/upload-artifact@v4
        with:
          name: RoyalSpin-Landscape-v2.1-startup-safe-APK
          path: landscapeApp/build/outputs/apk/debug/landscapeApp-debug.apk
          if-no-files-found: error
