name: Build Royal Spin 5.0 Landscape

on:
  pull_request:
  workflow_dispatch:

jobs:
  build-landscape:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install verified Gradle 8.13
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gradle-8.13-bin.zip"
          curl --fail --location --retry 8 --retry-delay 4 --retry-all-errors \
            "https://downloads.gradle.org/distributions/gradle-8.13-bin.zip" \
            --output "$archive"
          echo "20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78  $archive" \
            | sha256sum --check --strict
          unzip -q "$archive" -d "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/gradle-8.13/bin" >> "$GITHUB_PATH"

      - name: Validate landscape application
        id: validate
        shell: bash
        continue-on-error: true
        run: |
          set +e
          gradle --no-daemon --max-workers=2 \
            :landscape:testDebugUnitTest :landscape:lintDebug :landscape:assembleDebug \
            > landscape-validation.log 2>&1
          code=$?
          echo "$code" > landscape-validation-exit.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          tail -n 320 landscape-validation.log
          exit 0

      - name: Build validation report
        if: always()
        shell: bash
        run: |
          apk=landscape/build/outputs/apk/debug/landscape-debug.apk
          {
            echo "Royal Spin 5.0.0-landscape-premium"
            echo "Validation exit: $(cat landscape-validation-exit.txt 2>/dev/null || echo missing)"
            echo "UTC: $(date -u +%FT%TZ)"
            if [ -f "$apk" ]; then
              echo "APK bytes: $(stat -c%s "$apk")"
              echo "APK SHA-256: $(sha256sum "$apk" | cut -d' ' -f1)"
              unzip -t "$apk" | tail -n 2
            fi
          } | tee landscape-report.txt

      - name: Upload validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RoyalSpin-v5.0-landscape-validation
          path: |
            landscape-validation.log
            landscape-validation-exit.txt
            landscape-report.txt
            landscape/build/reports/tests/testDebugUnitTest/**
            landscape/build/reports/lint-results-debug.html
          if-no-files-found: warn

      - name: Verify validation
        run: test "${{ steps.validate.outputs.exit_code }}" = "0"

      - name: Upload landscape APK
        uses: actions/upload-artifact@v4
        with:
          name: RoyalSpin-v5.0-landscape-apk
          path: landscape/build/outputs/apk/debug/landscape-debug.apk
          if-no-files-found: error
