name: Build Royal Spin Final RC

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run full validation
        id: validate
        shell: bash
        continue-on-error: true
        run: |
          set +e
          gradle --no-daemon testDebugUnitTest lintDebug assembleDebug > final-validation.log 2>&1
          code=$?
          echo "$code" > final-validation-exit.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          tail -n 220 final-validation.log
          exit 0

      - name: Build validation report
        if: always()
        shell: bash
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          {
            echo "Royal Spin 1.5.0-rc1"
            echo "Validation exit: $(cat final-validation-exit.txt 2>/dev/null || echo missing)"
            echo "UTC: $(date -u +%FT%TZ)"
            if [ -f "$apk" ]; then
              echo "APK bytes: $(stat -c%s "$apk")"
              echo "APK SHA-256: $(sha256sum "$apk" | cut -d' ' -f1)"
              unzip -t "$apk" | tail -n 2
            fi
          } | tee final-report.txt

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RoyalSpin-final-v1.5-validation
          path: |
            final-validation.log
            final-validation-exit.txt
            final-report.txt
            app/build/reports/tests/testDebugUnitTest/**
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn

      - name: Verify validation
        shell: bash
        run: test "${{ steps.validate.outputs.exit_code }}" = "0"

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: RoyalSpin-final-v1.5-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error