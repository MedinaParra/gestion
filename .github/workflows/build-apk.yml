name: Build Royal Spin Royal Art APK

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run tests and capture diagnostic
        id: tests
        shell: bash
        continue-on-error: true
        run: |
          set +e
          gradle --no-daemon testDebugUnitTest > gradle-test.log 2>&1
          code=$?
          echo "$code" > gradle-test-exit.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          tail -n 160 gradle-test.log
          exit 0

      - name: Upload Gradle diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: RoyalSpin-v0.9-gradle-diagnostic
          path: |
            gradle-test.log
            gradle-test-exit.txt
          if-no-files-found: error

      - name: Verify tests
        shell: bash
        run: test "${{ steps.tests.outputs.exit_code }}" = "0"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RoyalSpin-royal-art-v0.9-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
