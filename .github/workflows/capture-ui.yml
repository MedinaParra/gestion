name: Capture Royal Spin 2.0 Cinematics

on:
  pull_request:
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true

      - name: Install emulator image
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "emulator" \
            "platforms;android-35" "build-tools;35.0.0" \
            "system-images;android-29;default;x86_64"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Create and boot AVD
        id: boot
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p screenshots
          {
            echo "PWD=$(pwd)"
            echo "ANDROID_HOME=$ANDROID_HOME"
            sdkmanager --list_installed
            echo no | avdmanager create avd \
              --force --name royal_spin_v2 \
              --package "system-images;android-29;default;x86_64" \
              --device "pixel_2"
            create_code=$?
            echo "AVD_CREATE_EXIT=$create_code"
            find "$HOME/.android" -maxdepth 4 -type f -print || true
            if [ "$create_code" -ne 0 ]; then exit "$create_code"; fi

            config="$HOME/.android/avd/royal_spin_v2.avd/config.ini"
            printf '\nhw.cpu.ncore=2\nhw.ramSize=2048\nhw.gpu.enabled=yes\nhw.gpu.mode=swiftshader_indirect\n' >> "$config"
            nohup emulator @royal_spin_v2 \
              -no-window -no-snapshot -noaudio -no-boot-anim \
              -gpu swiftshader_indirect -accel on -memory 2048 \
              > screenshots/emulator.log 2>&1 &
            emulator_pid=$!
            echo "$emulator_pid" > screenshots/emulator.pid
            echo "EMULATOR_PID=$emulator_pid"

            adb start-server
            if ! timeout 180 adb wait-for-device; then
              echo "ADB_DEVICE_TIMEOUT"
              adb devices -l || true
              tail -n 300 screenshots/emulator.log || true
              kill "$emulator_pid" 2>/dev/null || true
              exit 1
            fi
            adb devices -l || true
            booted=""
            for attempt in $(seq 1 240); do
              booted=$(timeout 10 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
              echo "BOOT_ATTEMPT=$attempt VALUE=$booted"
              if [ "$booted" = "1" ]; then break; fi
              if ! kill -0 "$emulator_pid" 2>/dev/null; then
                echo "EMULATOR_PROCESS_EXITED"
                break
              fi
              sleep 2
            done
            if [ "$booted" != "1" ]; then
              echo "AVD did not complete boot"
              adb devices -l || true
              tail -n 300 screenshots/emulator.log || true
              kill "$emulator_pid" 2>/dev/null || true
              exit 1
            fi
            touch screenshots/boot-ready
            adb shell input keyevent 82 || true
            adb shell settings put secure immersive_mode_confirmations confirmed || true
            adb install -r app/build/outputs/apk/debug/app-debug.apk
          } > screenshots/boot-diagnostic.log 2>&1
          code=$?
          cat screenshots/boot-diagnostic.log
          exit "$code"

      - name: Capture advanced states
        if: always()
        shell: bash
        run: |
          set -u
          if [ ! -f screenshots/boot-ready ]; then
            echo "Capture skipped because AVD was not ready" >> screenshots/capture-error.txt
            exit 0
          fi
          adb logcat -c || true

          capture() {
            mode="$1"
            file="$2"
            delay="$3"
            adb shell am force-stop cl.exequiel.royalspin || true
            if [ -z "$mode" ]; then
              adb shell am start -W -n cl.exequiel.royalspin/.MainActivity || true
            else
              adb shell am start -W -n cl.exequiel.royalspin/.MainActivity --es demo "$mode" || true
            fi
            sleep "$delay"
            adb exec-out screencap -p > "screenshots/$file"
            test -s "screenshots/$file"
          }

          capture ""        01-idle-v2.png                 3
          capture bell      02-bell-rings.png              8
          capture bar       03-bar-locks.png               8
          capture seven     04-seven-energy.png            8
          capture diamond   05-diamond-prism.png           8
          capture five      06-five-wild-royal-trigger.png 8

          adb shell am force-stop cl.exequiel.royalspin || true
          adb shell pm clear cl.exequiel.royalspin || true
          adb shell am start -W -n cl.exequiel.royalspin/.MainActivity --es demo feature
          sleep 8
          adb exec-out screencap -p > screenshots/07-feature-trigger.png
          sleep 5
          adb exec-out screencap -p > screenshots/08-royal-feature-intro.png
          sleep 8
          adb exec-out screencap -p > screenshots/09-free-spins-hud.png

          adb shell am force-stop cl.exequiel.royalspin || true
          adb shell pm clear cl.exequiel.royalspin || true
          adb shell am start -W -n cl.exequiel.royalspin/.MainActivity --es demo retrigger
          sleep 11
          adb exec-out screencap -p > screenshots/10-wild-retrigger.png

          adb logcat -d > screenshots/logcat.txt || true
          if grep -q "FATAL EXCEPTION" screenshots/logcat.txt; then
            grep -A 50 "FATAL EXCEPTION" screenshots/logcat.txt > screenshots/runtime-summary.txt
            exit 1
          fi

      - name: Validate images
        if: always()
        shell: bash
        run: |
          if [ ! -f screenshots/boot-ready ]; then
            echo "No image validation: AVD did not boot"
            exit 0
          fi
          python - <<'PY'
          import pathlib, struct
          images = sorted(pathlib.Path('screenshots').glob('*.png'))
          assert len(images) == 10, f'Expected 10 screenshots, found {len(images)}'
          for image in images:
              data = image.read_bytes()
              assert data.startswith(b'\x89PNG\r\n\x1a\n'), image
              width, height = struct.unpack('>II', data[16:24])
              assert width > 300 and height > 600, (image, width, height)
              print(image.name, width, height, len(data))
          PY

      - name: Upload screenshots and runtime log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RoyalSpin-v2.0-cinematics
          path: screenshots/**
          if-no-files-found: error

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RoyalSpin-v2.0-emulator-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
