name: Capture Royal Spin Final UI

on:
  pull_request:
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Capture emulator screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          heap-size: 1024M
          disk-size: 4096M
          disable-animations: false
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -e
            mkdir -p screenshots
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell settings put secure immersive_mode_confirmations confirmed || true
            adb logcat -c || true

            launch() {
              mode="$1"
              adb shell am force-stop cl.exequiel.royalspin || true
              if [ -z "$mode" ]; then
                adb shell am start -W -n cl.exequiel.royalspin/.MainActivity
              else
                adb shell am start -W -n cl.exequiel.royalspin/.MainActivity --es demo "$mode"
              fi
            }

            shot() {
              adb exec-out screencap -p > "screenshots/$1"
              test -s "screenshots/$1"
            }

            launch ""
            sleep 2
            shot 01-idle-v1.5.png

            launch anticipation
            sleep 2.65
            shot 02-valid-anticipation.png

            launch bell
            sleep 3.65
            shot 03-bell-cinematic.png

            launch bar
            sleep 3.65
            shot 04-bar-mechanical.png

            launch seven
            sleep 3.65
            shot 05-seven-energy.png

            launch diamond
            sleep 3.65
            shot 06-diamond-prismatic.png

            launch wild
            sleep 3.75
            shot 07-wild-royal-win.png

            adb logcat -d > screenshots/logcat.txt || true
            if grep -q "FATAL EXCEPTION" screenshots/logcat.txt; then
              grep -A 30 "FATAL EXCEPTION" screenshots/logcat.txt > screenshots/runtime-summary.txt
              exit 1
            fi

      - name: Upload screenshots and runtime log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RoyalSpin-final-v1.5-screenshots
          path: screenshots/**
          if-no-files-found: warn

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RoyalSpin-final-v1.5-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error