name: Capture Royal Spin Free Spins v1.6

on:
  pull_request:
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Capture feature states
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          cores: 2
          disable-animations: false
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -e
            mkdir -p screenshots
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell settings put secure immersive_mode_confirmations confirmed || true
            adb logcat -c || true

            adb shell am force-stop cl.exequiel.royalspin || true
            adb shell am start -W -n cl.exequiel.royalspin/.MainActivity
            sleep 2
            adb exec-out screencap -p > screenshots/01-idle-v1.6.png

            adb shell am force-stop cl.exequiel.royalspin || true
            adb shell am start -W -n cl.exequiel.royalspin/.MainActivity --es demo feature
            sleep 3
            adb exec-out screencap -p > screenshots/02-wild-trigger.png
            sleep 2.6
            adb exec-out screencap -p > screenshots/03-feature-intro-30.png
            sleep 4.2
            adb exec-out screencap -p > screenshots/04-free-spins-hud.png

            test -s screenshots/01-idle-v1.6.png
            test -s screenshots/02-wild-trigger.png
            test -s screenshots/03-feature-intro-30.png
            test -s screenshots/04-free-spins-hud.png

            adb logcat -d > screenshots/logcat.txt || true
            if grep -q "FATAL EXCEPTION" screenshots/logcat.txt; then
              grep -A 30 "FATAL EXCEPTION" screenshots/logcat.txt > screenshots/runtime-summary.txt
              exit 1
            fi

      - name: Upload screenshots and runtime log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RoyalSpin-free-spins-v1.6-screenshots
          path: screenshots/**
          if-no-files-found: warn

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RoyalSpin-free-spins-v1.6-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
