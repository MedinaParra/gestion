name: Capture Royal Spin Premium UI

on:
  pull_request:
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Capture emulator screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          emulator-boot-timeout: 600
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -e
            mkdir -p screenshots
            adb install -r app/build/outputs/apk/debug/app-debug.apk

            adb shell am force-stop cl.exequiel.royalspin
            adb shell am start -W -n cl.exequiel.royalspin/.MainActivity
            sleep 2
            adb exec-out screencap -p > screenshots/01-idle-v0.9.png

            adb shell am force-stop cl.exequiel.royalspin
            adb shell am start -W -n cl.exequiel.royalspin/.MainActivity --es demo bell
            sleep 1.45
            adb exec-out screencap -p > screenshots/02-bell-spinning.png
            sleep 1.85
            adb exec-out screencap -p > screenshots/03-bell-celebration.png

            adb shell am force-stop cl.exequiel.royalspin
            adb shell am start -W -n cl.exequiel.royalspin/.MainActivity --es demo bar
            sleep 3.35
            adb exec-out screencap -p > screenshots/04-bar-celebration.png

            adb shell am force-stop cl.exequiel.royalspin
            adb shell am start -W -n cl.exequiel.royalspin/.MainActivity --es demo seven
            sleep 3.35
            adb exec-out screencap -p > screenshots/05-seven-celebration.png

            adb shell am force-stop cl.exequiel.royalspin
            adb shell am start -W -n cl.exequiel.royalspin/.MainActivity --es demo diamond
            sleep 3.35
            adb exec-out screencap -p > screenshots/06-diamond-celebration.png

            adb shell am force-stop cl.exequiel.royalspin
            adb shell am start -W -n cl.exequiel.royalspin/.MainActivity --es demo wild
            sleep 3.45
            adb exec-out screencap -p > screenshots/07-wild-royal-win.png

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: RoyalSpin-premium-symbols-v0.9
          path: screenshots/*.png
          if-no-files-found: error

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RoyalSpin-royal-art-v0.9-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
