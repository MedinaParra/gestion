name: Capture Royal Spin 2.0 Cinematics

on:
  pull_request:
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Capture advanced states
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          cores: 2
          disable-animations: false
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -u
            mkdir -p screenshots
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell settings put secure immersive_mode_confirmations confirmed || true
            adb logcat -c || true

            capture() {
              mode="$1"
              file="$2"
              delay="$3"
              adb shell am force-stop cl.exequiel.royalspin || true
              if [ -z "$mode" ]; then
                adb shell am start -W -n cl.exequiel.royalspin/.MainActivity || true
              else
                adb shell am start -W -n cl.exequiel.royalspin/.MainActivity --es demo "$mode" || true
              fi
              sleep "$delay"
              adb exec-out screencap -p > "screenshots/$file" || true
            }

            capture ""        01-idle-v2.png                 3
            capture bell      02-bell-rings.png              8
            capture bar       03-bar-locks.png               8
            capture seven     04-seven-energy.png            8
            capture diamond   05-diamond-prism.png           8
            capture five      06-five-wild-royal-trigger.png 8

            adb shell am force-stop cl.exequiel.royalspin || true
            adb shell pm clear cl.exequiel.royalspin || true
            adb shell am start -W -n cl.exequiel.royalspin/.MainActivity --es demo feature || true
            sleep 8
            adb exec-out screencap -p > screenshots/07-feature-trigger.png || true
            sleep 5
            adb exec-out screencap -p > screenshots/08-royal-feature-intro.png || true
            sleep 8
            adb exec-out screencap -p > screenshots/09-free-spins-hud.png || true

            adb shell am force-stop cl.exequiel.royalspin || true
            adb shell pm clear cl.exequiel.royalspin || true
            adb shell am start -W -n cl.exequiel.royalspin/.MainActivity --es demo retrigger || true
            sleep 11
            adb exec-out screencap -p > screenshots/10-wild-retrigger.png || true

            adb logcat -d > screenshots/logcat.txt || true
            for file in screenshots/*.png; do
              if [ ! -s "$file" ]; then echo "EMPTY $file" >> screenshots/capture-warnings.txt; fi
            done
            if grep -q "FATAL EXCEPTION" screenshots/logcat.txt; then
              grep -A 40 "FATAL EXCEPTION" screenshots/logcat.txt > screenshots/runtime-summary.txt
              exit 1
            fi

      - name: Upload screenshots and runtime log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RoyalSpin-v2.0-cinematics
          path: screenshots/**
          if-no-files-found: warn

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RoyalSpin-v2.0-emulator-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
