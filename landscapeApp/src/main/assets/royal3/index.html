<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <meta name="theme-color" content="#02030a" />
  <title>Royal Spin 3.2.1 Fluid</title>
  <style>
    html,body,#stage{margin:0;width:100%;height:100%;overflow:hidden;background:#02030a;touch-action:none;user-select:none;-webkit-user-select:none}
    canvas{display:block;width:100%;height:100%;touch-action:none}
    #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(circle at 50% 42%,#321254 0,#090713 45%,#010207 100%);color:#ffe491;font-family:Georgia,serif;z-index:9;transition:opacity .3s ease}
    #boot strong{font-size:60px;letter-spacing:.08em;text-shadow:0 0 22px #ffb52c}
    #boot span{margin-top:18px;font:600 14px Arial,sans-serif;letter-spacing:.24em;color:#d6d9e8}
    #boot.hide{opacity:0;pointer-events:none}
  </style>
</head>
<body>
  <div id="stage"></div>
  <div id="boot"><strong>ROYAL SPIN 3.2.1</strong><span>MODO FLUIDO OPTIMIZADO</span></div>
  <script src="pixi.min.js"></script>
  <script src="royal32-performance.js"></script>
  <script src="royal31-prelude.js"></script>
  <script src="royal3.compat.js"></script>
</body>
</html>
